<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ClassHub — Full Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #050505;
    --bg-card: #111113;
    --bg-input: #18181b;
    --border: #232326;
    --text: #F5F5F5;
    --text-dim: #8B8B93;
    --accent: #F5A623;
    --accent-dim: #7A5416;
    --accent-soft: rgba(245,166,35,0.14);
    --error: #E5484D;
    --green: #3DD68C;
  }

  /* Light theme — activated by adding class "light-theme" to <body> */
  body.light-theme {
    --bg: #F5F5F7;
    --bg-card: #FFFFFF;
    --bg-input: #F0F0F2;
    --border: #E2E2E5;
    --text: #0A0A0A;
    --text-dim: #6B6B70;
    --accent: #F5A623;
    --accent-dim: #C97F0E;
    --accent-soft: rgba(245,166,35,0.14);
    --error: #D42F3D;
    --green: #1FA968;
  }
  body.light-theme .zoom-overlay { background: rgba(255,255,255,0.97); }
  body.light-theme .modal-overlay { background: rgba(0,0,0,0.35); }
  body.light-theme .bottom-nav { background: rgba(245,245,247,0.9); }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

  /* ============ AUTH SCREEN ============ */
  .screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 20px; position: relative; overflow: hidden;
  }
  .clock-ring { position: absolute; top: 50%; left: 50%; width: 520px; height: 520px; transform: translate(-50%, -50%); opacity: 0.05; pointer-events: none; }
  .clock-ring svg { width: 100%; height: 100%; }
  .clock-ring circle { fill: none; stroke: var(--accent); }
  .brand { position: relative; z-index: 2; text-align: center; margin-bottom: 36px; }
  .brand-mark { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.25em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  .brand-tag { margin-top: 6px; font-size: 13px; color: var(--text-dim); }
  .card { position: relative; z-index: 2; width: 100%; max-width: 380px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px 26px; margin: 0 auto; }
  .tabs { display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600; color: var(--text-dim); border-radius: 9px; cursor: pointer; transition: all 0.25s ease; user-select: none; }
  .tab.active { background: var(--accent); color: #1a1200; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-dim); margin-bottom: 7px; }
  .field input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 11px; padding: 13px 14px; font-size: 15px; color: var(--text); font-family: 'Inter', sans-serif; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .field-error { font-size: 12px; color: var(--error); margin-top: 6px; display: none; }
  .field-error.show { display: block; }
  .submit-btn { width: 100%; background: var(--accent); color: #1a1200; border: none; border-radius: 11px; padding: 14px 0; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .submit-btn:active { transform: scale(0.98); }
  .switch-line { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
  .switch-line a { color: var(--accent); font-weight: 600; text-decoration: none; cursor: pointer; }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: #000000; color: #FFFFFF; border: 1px solid #3C3C3C;
    border-radius: 11px; padding: 13px 0; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-bottom: 18px;
  }
  .google-btn:active { transform: scale(0.98); }
  .or-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .or-divider span { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-panel { display: none; }
  .form-panel.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .live-clock { position: absolute; top: 22px; right: 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.05em; z-index: 3; }

  /* ============ MAIN APP SHELL ============ */
  #mainApp { display: none; }
  .app { position: relative; max-width: 420px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }

  .glow-strong, .glow-trace {
    position: fixed; top: -120px; left: -120px; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,166,35,0.35) 0%, rgba(245,166,35,0) 70%);
    pointer-events: none; z-index: 0; transition: opacity 0.15s linear, top 0.05s linear, left 0.05s linear;
  }
  .glow-trace { background: radial-gradient(circle, rgba(245,166,35,0.10) 0%, rgba(245,166,35,0) 70%); opacity: 1; }

  .content { position: relative; z-index: 1; padding: 26px 20px 100px; }

  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.25s ease; }

  /* Home header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; }
  .greeting { color: var(--text-dim); font-size: 13.5px; margin-top: 5px; }
  .add-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text); flex-shrink: 0; }

  /* ring */
  .ring-section { display: flex; flex-direction: column; align-items: center; margin: 26px 0 24px; }
  .ring-wrap { position: relative; width: 230px; height: 230px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-eyebrow { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; }
  .ring-time { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 38px; color: var(--accent); }
  .ring-next { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  /* stat row */
  .stat-row { display: flex; gap: 12px; margin-bottom: 22px; }
  .stat-card { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 15px 16px; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .stat-label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; margin-bottom: 8px; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 19px; }
  .stat-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .stat-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 11px; overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* routine card */
  .routine-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 16px 18px; margin-bottom: 22px; cursor: pointer; user-select: none; }
  .routine-head { display: flex; justify-content: space-between; align-items: center; }
  .routine-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
  .routine-hint { font-size: 11px; color: var(--text-dim); }
  .routine-lock { font-size: 10px; color: var(--accent); display: none; margin-top: 2px; }
  .routine-lock.show { display: block; }
  .routine-today { margin-top: 12px; }
  .routine-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  .routine-row:last-child { border-bottom: none; }
  .routine-row .subj { color: var(--text); }
  .routine-row .time { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
  .routine-week { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
  .routine-week.open { max-height: 4000px; margin-top: 14px; }
  .day-block { margin-bottom: 12px; }
  .day-name { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.03em; }

  /* subjects grid (Data Hub) */
  .section-label { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px; margin-bottom: 14px; }
  .subjects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .subject-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; cursor: pointer; transition: border-color 0.15s ease; }
  .subject-card:active { border-color: var(--accent); }
  .subject-icon { font-size: 20px; margin-bottom: 10px; display: block; }
  .subject-name { font-weight: 600; font-size: 14.5px; }
  .subject-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }

  /* bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 420px; margin: 0 auto; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; padding: 12px 0 18px; z-index: 5; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .nav-icon { font-size: 20px; opacity: 0.45; }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-item.active .nav-dot { opacity: 1; }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: 0; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-card); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 10px 18px; border-radius: 30px; opacity: 0; transition: all 0.25s ease; z-index: 10; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ SUBJECT PAGE + CHAPTERS + HW + EXAM CQ ============ */
  .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .top-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; }
  .top-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .mini-routine { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 20px; }
  .mini-routine-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .mini-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .time { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }

  .option-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .option-card:active { border-color: var(--accent); }
  .option-icon { font-size: 22px; width: 42px; height: 42px; border-radius: 12px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .option-title { font-weight: 600; font-size: 15px; }
  .option-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .option-arrow { margin-left: auto; color: var(--text-dim); }

  .chapter-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .chapter-name { font-weight: 600; font-size: 14.5px; }
  .chapter-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.2s ease; }

  .note-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .note-img-placeholder { width: 100%; height: 140px; border-radius: 12px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; margin-bottom: 10px; border: 1px dashed var(--border); }
  .note-caption { font-size: 13px; color: var(--text-dim); }
  .note-text { font-size: 14px; line-height: 1.6; }
  .voice-row { display: flex; align-items: center; gap: 12px; }
  .voice-play { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #1a1200; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .voice-bar { flex: 1; height: 4px; background: var(--bg-input); border-radius: 2px; overflow: hidden; }
  .voice-bar-fill { width: 35%; height: 100%; background: var(--accent); }
  .voice-time { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim); }

  /* topic list (HW) */
  .topic-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; user-select: none; }
  .topic-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topic-preview-thumb { width: 40px; height: 40px; border-radius: 10px; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; border: 1px dashed var(--border); }
  .topic-name { font-weight: 600; font-size: 14.5px; }
  .topic-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .topic-arrow { color: var(--text-dim); transition: transform 0.25s ease; }
  .topic-arrow.open { transform: rotate(90deg); }
  .topic-arrow.hidden { display: none; }
  .topic-dots { display: none; color: var(--text-dim); font-size: 18px; padding: 4px 8px; cursor: pointer; }
  .topic-dots.show { display: block; }
  .topic-stack { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .topic-stack.open { max-height: 4000px; margin-top: 12px; }
  .topic-stack .note-img-placeholder { margin-bottom: 8px; }
  .topic-stack .note-img-placeholder:last-child { margin-bottom: 0; }
  .add-topic-btn { text-align: center; padding: 14px 0; border: 1px dashed var(--border); border-radius: 16px; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px; }

  /* Exam CQ */
  .cq-stack { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 6px; cursor: pointer; user-select: none; }
  .cq-caption { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; }
  .cq-image-placeholder { width: 100%; height: 160px; border-radius: 12px; background: var(--bg-input); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--text-dim); }
  .cq-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; }
  .cq-full-stack { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
  .cq-full-stack.open { max-height: 4000px; margin-top: 14px; }
  .cq-entry { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
  .cq-add-wrap { display: flex; justify-content: center; margin-top: 16px; }
  .cq-add-btn { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #1a1200; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(245,166,35,0.3); }

  /* zoom / lightbox overlay */
  .zoom-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 20; flex-direction: column; }
  .zoom-overlay.open { display: flex; }
  .zoom-close { position: absolute; top: 20px; right: 20px; z-index: 21; color: var(--text); width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }

  .viewer-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 22;
    display: flex; align-items: center; gap: 10px; padding: 18px 16px;
    transition: opacity 0.2s ease; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }
  .viewer-header.hidden { opacity: 0; pointer-events: none; }
  .viewer-back {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text); cursor: pointer; flex-shrink: 0;
  }
  .viewer-date { flex: 1; text-align: center; color: var(--text); font-size: 13.5px; font-weight: 600; }
  .viewer-time { color: var(--text-dim); font-size: 12px; width: 64px; text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .zoom-scroll { flex: 1; overflow-y: auto; scroll-snap-type: y mandatory; padding-top: 70px; }
  .zoom-slide { scroll-snap-align: start; min-height: calc(100vh - 70px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .zoom-caption { color: var(--text); font-size: 14px; margin-bottom: 16px; text-align: center; }
  .zoom-image { max-width: 92%; max-height: 80vh; border-radius: 10px; object-fit: contain; cursor: zoom-in; transform-origin: center center; background: var(--bg-card); }
  .zoom-image.zoomed { cursor: zoom-out; }
  .zoom-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: var(--text-dim); font-size: 12px; }

  /* Edit page */
  .field select {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 14px; font-size: 15px; color: var(--text); font-family: 'Inter', sans-serif; outline: none;
  }
  .field select:focus, .field input:focus { border-color: var(--accent); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .add-entry-btn {
    width: 100%; background: var(--accent); color: #1a1200; border: none; border-radius: 11px;
    padding: 13px 0; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; margin-bottom: 22px;
  }
  .routine-entry {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .routine-entry-info { font-size: 13.5px; }
  .routine-entry-day { color: var(--accent); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .routine-entry-detail { color: var(--text-dim); font-size: 12px; margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .entry-delete {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg-input); color: var(--error);
    display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .empty-list-hint { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px 0; }

  /* multi-photo stack grid preview (Chapter Images) */
  .stack-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stack-grid-cell {
    position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    background: var(--bg-input); border: 1px dashed var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-dim);
  }
  .stack-grid-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .more-count {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; border-radius: 10px;
  }

  /* in-page modal system (replaces native prompt/confirm which don't work in sandboxed previews) */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 30;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 420px; padding: 22px 20px 26px; animation: modalUp 0.2s ease;
  }
  @keyframes modalUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-weight: 700; font-size: 16px; margin-bottom: 14px; font-family: 'Space Grotesk', sans-serif; }
  .modal-input {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 11px;
    padding: 13px 14px; color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; outline: none; margin-bottom: 4px;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-option {
    padding: 15px 4px; border-bottom: 1px solid var(--border); font-size: 15px; cursor: pointer; user-select: none;
  }
  .modal-option:last-child { border-bottom: none; }
  .modal-option.danger { color: var(--error); }
  .modal-btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .modal-btn { flex: 1; text-align: center; padding: 13px 0; border-radius: 11px; font-weight: 600; font-size: 14px; cursor: pointer; user-select: none; }
  .modal-btn.primary { background: var(--accent); color: #1a1200; }
  .modal-btn.secondary { background: var(--bg-input); color: var(--text); }

  /* Profile page */
  .profile-avatar {
    width: 88px; height: 88px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: pointer; overflow: hidden;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .toggle-switch {
    width: 44px; height: 26px; border-radius: 14px; background: var(--bg-input); border: 1px solid var(--border);
    position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.2s ease;
  }
  .toggle-switch.on { background: var(--accent); border-color: var(--accent); }
  .toggle-knob { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: left 0.2s ease; }
  .toggle-switch.on .toggle-knob { left: 20px; }

  /* Dark/Light theme popup */
  .mode-popup-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 35;
    align-items: flex-start; justify-content: flex-end; padding: 78px 20px 0 0;
  }
  .mode-popup-overlay.open { display: flex; }
  .mode-popup-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 6px; width: 170px;
    animation: modalUp 0.15s ease;
  }
  .mode-option {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 12px;
    border-radius: 10px; cursor: pointer; opacity: 0.4; transition: all 0.2s ease; font-size: 14px; font-weight: 600;
  }
  .mode-option.active {
    opacity: 1; background: var(--accent-soft); color: var(--accent);
    box-shadow: 0 0 14px rgba(245,166,35,0.25);
  }
  .mode-tick { display: none; font-weight: 700; }
  .mode-option.active .mode-tick { display: inline; }

  /* Saved Videos */
  .video-card {
    display: flex; align-items: center; gap: 12px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; margin-bottom: 10px; cursor: pointer;
  }
  .video-thumb {
    width: 56px; height: 56px; border-radius: 10px; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); flex-shrink: 0;
  }
  .video-info { flex: 1; min-width: 0; }
  .video-title { font-weight: 600; font-size: 14px; }
  .video-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<div id="authView">
  <div class="screen">

        <circle cx="100" cy="100" r="70" stroke-width="1"></circle>

      <div class="brand-tag">Your classes, chapters &amp; notes — all in one place</div>

        <span>Continue with Google</span>
      </div>
      <div class="or-divider"><span>or</span></div>
      <div class="tabs">
        <div class="tab active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</div>
        <div class="tab" id="tabSignUp" onclick="switchAuthTab('signup')">Sign Up</div>
      </div>

      <div class="form-panel active" id="panelSignIn">
        <div class="field">
          <label>Email</label>
          <input type="email" id="siEmail" placeholder="you@email.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="siPass" placeholder="••••••••">
          <div class="field-error" id="siError">Please fill in both fields.</div>
          <div style="text-align:right; margin-top:8px;"><a onclick="handleForgotPassword()" style="color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer;">Forgot password?</a></div>
        </div>
        <button class="submit-btn" onclick="handleSignIn()">Sign In</button>
        <div class="switch-line">New here? <a onclick="switchAuthTab('signup')">Create an account</a></div>
      </div>

      <div class="form-panel" id="panelSignUp">
        <div class="field">
          <label>Full name</label>
          <input type="text" id="suName" placeholder="Your name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="suEmail" placeholder="you@email.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="suPass" placeholder="At least 6 characters">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="suConfirm" placeholder="Repeat password">
          <div class="field-error" id="suError">Check the fields above and try again.</div>
        </div>
        <button class="submit-btn" onclick="handleSignUp()">Create Account</button>
        <div class="switch-line">Already have an account? <a onclick="switchAuthTab('signin')">Sign in</a></div>
      </div>
    </div>
  </div>
</div>
